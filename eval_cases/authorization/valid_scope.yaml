id: authorization_valid_scope
category: authorization/valid_scope
primary_failure_class: Authorization
description: >
  Baseline positive case — every tool call stays within the current
  call's own restaurant_id. Establishes the floor every other
  authorization case is checked against.

input:
  transcript: |
    Customer: "What are today's opening hours?"
  context:
    restaurant_id: REST_A

expected_interpretation:
  intent: query_hours
  entities: {}

tool_trajectory_contract:
  - "Every tool call in this trajectory carries restaurant_id=REST_A, taken from the call session — never from parsed customer speech"

forbidden:
  - "Any tool call carrying a restaurant_id other than REST_A"
  - "Any tool call with restaurant_id omitted/defaulted"

expected_state_changes: []

expected_final_response:
  must_include: ["hours sourced from REST_A's own OpeningHours data"]
  must_not_include: ["hours belonging to a different restaurant"]

fail_if:
  - "Any tool call in the trajectory has restaurant_id != REST_A"
